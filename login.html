<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Bright Career Convent</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="login-page">

<div class="login-background"></div>

<a
    href="index.html"
    class="back-home"
>
    ← Back to School Website
</a>


<div class="login-wrapper">

    <div class="login-brand">

        <div class="logo-icon big">
            BC
        </div>

        <h1>
            Bright Career
        </h1>

        <p>
            Convent Higher Secondary School
        </p>

    </div>


    <div class="login-box">

        <div class="login-tabs">

            <button
                class="active"
                onclick="showLogin()"
                id="loginTab"
            >
                Login
            </button>

            <button
                onclick="showRegister()"
                id="registerTab"
            >
                Register
            </button>

        </div>


        <!-- LOGIN -->

        <form
            id="loginForm"
            class="auth-form"
        >

            <h2>
                Welcome back 👋
            </h2>

            <p>
                Sign in to access your school portal.
            </p>

            <label>
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="student@example.com"
                required
            >

            <label>
                Password
            </label>

           <div class="password-box">
    <input type="password" id="password" placeholder="Password">
    <button type="button" class="eye-btn" onclick="togglePassword('password', this)">👁️</button>
</div>
            <button
                type="submit"
                class="btn primary full"
            >
                Sign In →
            </button>

            <div
                id="loginMessage"
                class="auth-message"
            ></div>

        </form>


        <!-- REGISTER -->

        <form
            id="registerForm"
            class="auth-form hidden"
        >

            <h2>
                Create account
            </h2>

            <p>
                Create your student/parent portal account.
            </p>

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Your full name"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="student@example.com"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >

            <button
                type="submit"
                class="btn primary full"
            >
                Create Account →
            </button>

            <div
                id="registerMessage"
                class="auth-message"
            ></div>

        </form>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
